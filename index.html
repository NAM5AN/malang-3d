<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f1ea" />
    <meta
      name="description"
      content="촉촉한 젤리부터 바삭한 왁뿌볼까지. 손끝에서 출렁이는 49가지 말랑이를 만나 보세요."
    />
    <title>말랑 — 손끝에 작은 쉼</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Crect x='4' y='9' width='52' height='45' rx='23' fill='%238bb39e'/%3E%3Cellipse cx='23' cy='22' rx='10' ry='5' fill='%23c9e4d7'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="말랑 홈"
        ><span class="brand-mark"></span><b>말랑</b
        ><span class="brand-note">손끝에 작은 쉼</span></a
      >
      <div class="header-actions">
        <span class="wallet" title="말랑이를 만지면 솜을 모을 수 있어요"
          ><span>✳</span> <b id="coins">180</b><small>솜</small></span
        ><button class="quiet icon-button" id="sound" aria-label="소리 끄기">
          ♫</button
        ><button class="quiet icon-button" id="help" aria-label="놀이 방법">
          ?
        </button>
      </div>
    </header>
    <div class="workspace">
      <aside class="collection-panel" id="collection-panel">
        <button class="mobile-drawer" id="drawer-toggle" aria-expanded="false">
          내 말랑이 <span id="mobile-count"></span
          ><span class="chevron">⌃</span>
        </button>
        <div class="collection-inner">
          <div class="panel-title">
            <h2>오늘은 어떤 촉감?</h2>
            <span id="owned-count"></span>
          </div>
          <div class="tabs" role="tablist" aria-label="말랑이 모음">
            <button
              id="tab-owned"
              class="active"
              role="tab"
              aria-selected="true"
            >
              내 말랑이</button
            ><button id="tab-book" role="tab" aria-selected="false">
              도감 <small>49</small>
            </button>
          </div>
          <label class="search"
            ><span>⌕</span
            ><input
              id="search"
              type="search"
              placeholder="이름이나 촉감 찾기"
              aria-label="말랑이 검색"
          /></label>
          <div class="filter-row">
            <button class="active" data-filter="all">전체</button
            ><button data-filter="jelly">젤리</button
            ><button data-filter="wax">왁스</button
            ><button data-filter="slow">반죽·솜</button>
          </div>
          <p class="book-note" id="book-note" hidden>
            아직 만나지 못한 친구도 미리 만져볼 수 있어요.
          </p>
          <div
            class="slime-list"
            id="slime-list"
            role="list"
            aria-label="말랑이 목록"
          ></div>
          <div class="panel-bottom">
            <button id="draw" class="primary">
              <span>새 친구 만나기</span><small>✳ 40</small>
            </button>
            <div class="secondary-row">
              <button id="craft" class="quiet">✧ 나만의 말랑이</button
              ><button id="shop" class="quiet">재료 상점 ↗</button>
            </div>
          </div>
        </div>
      </aside>
      <main class="play-area">
        <div id="stage" class="stage"></div>
        <div class="slime-heading">
          <div class="eyebrow">
            <span id="grade" class="grade">COMMON</span
            ><span id="preview-badge" hidden>미리 만져보기</span
            ><span id="level"></span>
          </div>
          <h1 id="slime-name">물젤리 슬랑이</h1>
          <p id="slime-description"></p>
          <div class="trait-tags" id="traits"></div>
        </div>
        <div class="stage-tools">
          <button
            class="round-tool"
            id="reset"
            aria-label="말랑이 모양 초기화"
            title="처음 모양으로"
          >
            ↺</button
          ><button
            class="round-tool"
            id="camera"
            aria-label="시점 초기화"
            title="시점 되돌리기"
          >
            ⌖</button
          ><button
            class="round-tool"
            id="manage"
            aria-label="이름과 보관 관리"
            title="이름과 보관 관리"
          >
            ···
          </button>
        </div>
        <div class="feel-note" id="feel-note" aria-live="polite"></div>
        <div class="stage-footer">
          <div class="play-hint">
            <span class="hint-icon">↔</span>
            <p>
              <b>잡고, 늘리고, 놓아 보세요.</b
              ><span>두 손가락으로 양쪽을 늘릴 수도 있어요.</span>
            </p>
            <button id="poke" class="poke-button">꾸욱 눌러보기</button>
          </div>
          <div class="backgrounds" role="group" aria-label="배경 색">
            <button
              data-bg="cream"
              class="active"
              aria-label="크림 배경"
              style="--swatch: #ded9ca"
            ></button
            ><button
              data-bg="rose"
              aria-label="분홍 배경"
              style="--swatch: #dcb8be"
            ></button
            ><button
              data-bg="mint"
              aria-label="민트 배경"
              style="--swatch: #aec5b0"
            ></button
            ><button
              data-bg="night"
              aria-label="밤 배경"
              style="--swatch: #454b5d"
            ></button>
          </div>
        </div>
        <div id="loading" class="loading">
          말랑한 시간을 준비하고 있어요<span></span>
        </div>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <dialog id="modal">
      <div class="modal-top">
        <span class="modal-kicker" id="modal-kicker">MALANG STUDIO</span
        ><button class="quiet close" id="close-modal" aria-label="닫기">
          ×
        </button>
      </div>
      <div id="modal-content"></div>
    </dialog>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
